version: 2

sources:
  - name: uc1_zara_sales      
    description: "sales data from Zara UC1 pipeline"                   # logical name you'll reference in models: source('zara', 'table')
    # database: awsdatacatalog      # Athena: your Glue catalog / database name
    schema: offybi            # Athena: same as database usually
    tables:
      - name: uc1_zara_product_sales_stg
        description: "Raw Zara product sales data loaded from S3"
      - name: uc1_zara_product_sales_raw
        description: "Original Kaggle Zara sales file as uploaded to S3 (before cleaning)"

  - name: uc2_retail_kit
    description: "Retail kit raw CSV tables uploaded by the team to s3://offy-bi-demo/data/offybi/retail_kit/"
    schema: offybi
    tables:
      - name: rtl_customer
        description: "Customer master: demographics, type, level, nationality"
      - name: rtl_ecom_behave_to_order
        description: "E-commerce funnel by purchase date: views, carts, removals, orders"
      - name: rtl_order
        description: "Order lines with location, amounts, discount, profit and fulfilment dates"
      - name: rtl_product
        description: "Product master: SKU, name, category, price"
      - name: rtl_sales
        description: "Store sales transactions by date and hour, with traffic and gross profit"
      - name: rtl_store
        description: "Store master: code, location, manager, country, market"

  - name: uc3_retail_fashion
    description: "Retail fashion Parquet tables converted from SharePoint CSVs, in s3://offy-bi-demo/data/offybi/retail_fashion/"
    schema: offybi
    tables:
      - name: uc3_rtl_fsh_customers
        description: "Customer master: name, contact, city, country, gender, date of birth, job title"
      - name: uc3_rtl_fsh_discounts
        description: "Discount campaigns by period and product category / sub-category"
      - name: uc3_rtl_fsh_employees
        description: "Employees per store with position (Manager, Seller)"
      - name: uc3_rtl_fsh_products
        description: "Product master: category, sub-category, multilingual descriptions, color, sizes, production cost"
      - name: uc3_rtl_fsh_stores
        description: "Store master: country, city, name, employees, zip code, coordinates"
      - name: uc3_rtl_fsh_transactions
        description: "Timely sales and returns per date x store x product x currency (aggregated from invoice lines); 3 yearly files"

  - name: referential
    schema: offybi
    tables:
      - name: ref_calendar
        description: calendar table for generic usage
      - name: ref_time
        description: time table to minute
      - name: ref_exchange_rates
        description: exchange_rates
      
      - name: ref_color_codes
        description: hex codes for color of products