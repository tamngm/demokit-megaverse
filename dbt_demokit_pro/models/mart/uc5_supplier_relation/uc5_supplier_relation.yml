version: 2

# uc5 supplier relationship management (srm): supplier quotes knowledge base, masked values.
# Star schema: facts join the dims on supplier, editor, sku (= dim sku_code), end_customer; the facts join each
# other on quote_key. Dates join dim_calendar.

models:
  # ---------------- dims ----------------
  - name: uc5_srm_dim_supplier
    description: "One row per supplier with its type, from uc5_srm_supplier_editor_wk"
    columns:
      - name: supplier
        description: "Supplier name (key); joins to the facts"
        data_tests: [unique, not_null]
      - name: supplier_type
        description: "vendor_direct, distributor, service_provider, internal_affiliate"

  - name: uc5_srm_dim_supplier_editor
    description: "One row per supplier x editor (supplier list + pairs found only in quote lines): which supplier sells which editor, number of quotes, first / last seen"
    columns:
      - name: supplier
        description: "Supplier name; joins to uc5_srm_dim_supplier"
        data_tests: [not_null]
      - name: editor
        description: "Editor name; joins to uc5_srm_dim_editor"
        data_tests: [not_null]
      - name: supplier_type
        description: "vendor_direct, distributor, service_provider, internal_affiliate; NULL for pairs found only in quote lines"
      - name: quote_count
        description: "Number of quotes from this supplier for this editor (supplier list, else counted from quote lines)"
      - name: first_seen
        description: "Date of the first quote from this supplier for this editor; NULL for pairs found only in quote lines"
      - name: last_seen
        description: "Date of the last quote from this supplier for this editor; NULL for pairs found only in quote lines"

  - name: uc5_srm_dim_editor
    description: "One row per editor (software / hardware vendor), from uc5_srm_supplier_editor_wk"
    columns:
      - name: editor
        description: "Editor name (key); joins to the facts"
        data_tests: [unique, not_null]

  - name: uc5_srm_dim_sku
    description: "One row per SKU: the SKU list, plus SKUs found only in quote lines so every line finds its SKU"
    columns:
      - name: sku_code
        description: "SKU code (key); joins to uc5_srm_fact_quote_lines.sku and uc5_srm_fact_line_prices.sku"
        data_tests: [unique, not_null]
      - name: editor
        description: "Editor of the SKU"
      - name: description
        description: "SKU description"
      - name: item_type
        description: "SOFTWARE, HARDWARE, SERVICE, FEE"
      - name: times_quoted
        description: "Number of quotes the SKU appears in; NULL for SKUs found only in quote lines"
      - name: first_seen
        description: "First quote date; NULL for SKUs found only in quote lines"
      - name: last_seen
        description: "Last quote date; NULL for SKUs found only in quote lines"
      - name: is_from_lines_only
        description: "true when the SKU is not in the SKU list and was added from the quote lines"

  - name: uc5_srm_dim_customer
    description: "One row per end customer: number of quotes, first / last quote date"
    columns:
      - name: end_customer
        description: "End customer name (key); joins to uc5_srm_fact_quotes"
        data_tests: [unique, not_null]
      - name: quote_count
        description: "Number of quotes for the customer"
      - name: first_quote_date
        description: "Date of the first quote"
      - name: last_quote_date
        description: "Date of the last quote"

  # ---------------- facts ----------------
  - name: uc5_srm_fact_quotes
    description: "Grain: one row per quote (quote_key = oid + quote_number). Exact duplicate rows removed; quotes without a quote_number are left out (data quality, not in this demo). Amounts in the quote currency and in EUR."
    columns:
      - name: quote_key
        description: "Quote key (hash of oid + quote_number); joins to the other uc5 facts"
        data_tests: [unique, not_null]
      - name: oid
        description: "Opportunity id"
      - name: quote_number
        description: "Quote number"
      - name: document_count
        description: "Number of source rows merged into this quote (1, or 2 when the source repeats the quote)"
      - name: supplier
        description: "Supplier; joins to uc5_srm_dim_supplier"
      - name: supplier_type
        description: "Supplier type"
      - name: editor
        description: "Editor; joins to uc5_srm_dim_editor"
      - name: end_customer
        description: "End customer; joins to uc5_srm_dim_customer"
      - name: doc_type
        description: "quote, order_form, order_confirmation, purchase_order ..."
      - name: direction
        description: "BUY (supplier quote to us) or SELL (our quote to the customer)"
      - name: revision
        description: "Quote revision"
      - name: quote_date
        description: "Quote date; joins to dim_calendar"
      - name: valid_until
        description: "End of the quote validity"
      - name: validity_days
        description: "Days from quote_date to valid_until; NULL if either date is missing"
      - name: contract_start
        description: "Contract start date"
      - name: contract_end
        description: "Contract end date"
      - name: term_months
        description: "Contract term in months"
      - name: billing_frequency
        description: "monthly, annual, upfront"
      - name: payment_terms
        description: "Payment terms as printed"
      - name: incoterms
        description: "Incoterms"
      - name: project_name
        description: "Project name"
      - name: vendor_quote_ref
        description: "Vendor quote reference"
      - name: deal_reg
        description: "Deal registration id(s)"
      - name: sales_contact
        description: "Supplier sales contact"
      - name: business_line
        description: "Business line (demo scenario)"
      - name: line_count_declared
        description: "Number of lines as declared on the quote"
      - name: line_count
        description: "Number of lines found in uc5_srm_fact_quote_lines"
      - name: eur_per_unit
        description: "EUR for 1 unit of the quote currency (ref_exchange_rates)"
      - name: tax_amt_qadj_eur
        description: "Tax from the quote adjustments, in EUR (positive: added to the total)"
      - name: freight_amt_qadj_eur
        description: "Freight from the quote adjustments, in EUR (positive: added to the total)"
      - name: onetime_disc_amt_qadj_eur
        description: "One-time discount from the quote adjustments, in EUR. Negative: amount subtracted from the lines to get total_net_excl_tax (sum of lines + this = total net)"
      - name: total_list_eur
        description: "Total at list price in EUR"
      - name: total_net_excl_tax_eur
        description: "Total net excluding tax in EUR"
      - name: tax_amount_eur
        description: "Tax amount in EUR"
      - name: total_incl_tax_eur
        description: "Total including tax in EUR"
      - name: discount_rate
        description: "1 - total_net / total_list as a ratio (0.25 = 25%); recompute in Power BI instead of averaging"

  - name: uc5_srm_fact_quote_lines
    description: "Grain: one row per quote line (quote_line_key = quote_key + line_no). Exact duplicate rows removed; lines without a quote_number left out. Amounts in the line currency and in EUR."
    columns:
      - name: quote_line_key
        description: "Line key (hash of quote_key + line_no); joins to uc5_srm_fact_line_prices"
        data_tests: [unique, not_null]
      - name: quote_key
        description: "Quote key; joins to uc5_srm_fact_quotes"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('uc5_srm_fact_quotes')
                field: quote_key
      - name: oid
        description: "Opportunity id"
      - name: quote_number
        description: "Quote number"
      - name: line_no
        description: "Line number in the quote"
      - name: parent_line_no
        description: "Parent line number (support / add-on lines)"
      - name: supplier
        description: "Supplier; joins to uc5_srm_dim_supplier"
      - name: editor
        description: "Editor; joins to uc5_srm_dim_editor"
      - name: sku
        description: "SKU; joins to uc5_srm_dim_sku.sku_code"
      - name: covered_sku
        description: "SKU covered by this line (support, renewal)"
      - name: item_type
        description: "SOFTWARE, HARDWARE, SERVICE, FEE"
      - name: description
        description: "Line description"
      - name: unit_of_measure
        description: "Unit of measure"
      - name: business_line
        description: "Business line (demo scenario)"
      - name: start_date
        description: "Line start date"
      - name: end_date
        description: "Line end date"
      - name: term_months
        description: "Line term in months"
      - name: currency
        description: "Line currency"
      - name: quantity
        description: "Quantity"
      - name: unit_list_price
        description: "Unit list price, line currency"
      - name: unit_net_price
        description: "Unit net price, line currency"
      - name: discount_pct
        description: "Discount % on the line"
      - name: effective_discount_pct
        description: "Effective discount % (net vs list)"
      - name: line_total_list
        description: "Line total at list price, line currency"
      - name: line_total_net
        description: "Line total net, line currency"
      - name: line_discount_amount
        description: "line_total_list - line_total_net, line currency"
      - name: eur_per_unit
        description: "EUR for 1 unit of the line currency (ref_exchange_rates)"
      - name: unit_net_price_eur
        description: "Unit net price in EUR"
      - name: line_total_list_eur
        description: "Line total at list price in EUR"
      - name: line_total_net_eur
        description: "Line total net in EUR"
      - name: line_discount_amount_eur
        description: "Line discount amount in EUR"

  - name: uc5_srm_fact_payment_schedule
    description: "Grain: one row per payment instalment of a quote (quote_key x seq). Amounts in the quote currency and in EUR."
    columns:
      - name: quote_key
        description: "Quote key; joins to uc5_srm_fact_quotes"
        data_tests: [not_null]
      - name: oid
        description: "Opportunity id"
      - name: quote_number
        description: "Quote number"
      - name: editor
        description: "Editor; joins to uc5_srm_dim_editor"
      - name: seq
        description: "Instalment number"
      - name: label
        description: "Instalment label as printed"
      - name: due_date
        description: "Due date; joins to dim_calendar"
      - name: period_start
        description: "Start of the period paid"
      - name: period_end
        description: "End of the period paid"
      - name: currency
        description: "Currency"
      - name: amount
        description: "Instalment amount, quote currency"
      - name: amount_eur
        description: "Instalment amount in EUR"

  - name: uc5_srm_fact_line_prices
    description: "Grain: one row per price component of a quote line (list, net, each discount, fee, usage rate, by period); shows how the line price and discount are built. Rows without a quote_number left out. When basis = PERCENT the amount is a percentage and amount_eur is NULL."
    columns:
      - name: quote_key
        description: "Quote key (hash of oid + quote_number)"
        data_tests: [not_null]
      - name: quote_line_key
        description: "Line key (hash of quote_key + line_no); joins to uc5_srm_fact_quote_lines, the only relationship of this table in Power BI"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('uc5_srm_fact_quote_lines')
                field: quote_line_key
      - name: oid
        description: "Opportunity id"
      - name: quote_number
        description: "Quote number"
      - name: line_no
        description: "Line number in the quote"
      - name: seq
        description: "Order of the component within the line"
      - name: editor
        description: "Editor; joins to uc5_srm_dim_editor"
      - name: sku
        description: "SKU; joins to uc5_srm_dim_sku.sku_code"
      - name: component
        description: "NET, LIST, DISCOUNT, FEE, USAGE_RATE ..."
      - name: discount_type
        description: "STANDARD, PARTNER, OTHER ..."
      - name: basis
        description: "UNIT, EXTENDED or PERCENT"
      - name: price_period
        description: "TERM, MONTHLY, ONE_TIME ..."
      - name: schedule_label
        description: "Schedule label (Year 1, Year 2 ...)"
      - name: period_start
        description: "Period start"
      - name: period_end
        description: "Period end"
      - name: printed_label
        description: "Label as printed on the quote"
      - name: currency
        description: "Currency"
      - name: quantity
        description: "Quantity"
      - name: amount
        description: "Component amount, line currency (a % when basis = PERCENT)"
      - name: pct
        description: "Component percentage"
      - name: amount_eur
        description: "Component amount in EUR; NULL when basis = PERCENT"
