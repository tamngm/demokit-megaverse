version: 2

models:
  - name: uc1_dim_material
    description: "product material information"
    columns:
      - name: material
        description: "Material composition of the product"
        data_type: string
        tests:
          - unique
      - name: material_id
        description: "material id"
        data_type: int

  - name: uc1_dim_product
    description: "Product dimension table containing Zara product attributes, derived from the staging table."
    columns:
      - name: product_id
        description: "Unique identifier for each product."
        data_type: string

      - name: product_position
        description: "Position of the product in the catalog or listing."
        data_type: string

      - name: product_category
        description: "Category the product belongs to (e.g. tops, bottoms, accessories)."
        data_type: string

      - name: promotion
        description: "flag if product is promoted or not"
        data_type: string

      - name: seasonal
        description: "Indicates whether the product is seasonal."
        data_type: string

      - name: brand
        description: "Brand name of the product."
        data_type: string

      - name: url
        description: "Product page URL."
        data_type: string

      - name: name
        description: "Display name of the product."
        data_type: string

      - name: description
        description: "Full product description."
        data_type: string

      - name: price
        description: "Listed price of the product."
        data_type: double

      - name: terms
        description: "Terms and conditions associated with the product."
        data_type: string

      - name: section
        description: "Section or department the product belongs to (e.g. woman, man, kids)."
        data_type: string

      - name: season
        description: "Season the product is associated with (e.g. Summer 2024)."
        data_type: string

      - name: material
        description: "Material composition of the product"
        data_type: string

  - name: uc1_dim_season
    description: "product material information"
    columns:
      - name: season
        description: "Season the product is associated with (e.g. Summer 2024)."
        data_type: string
        tests:
          - unique
      - name: season_id
        description: "season id"
        data_type: int

  - name: uc1_dim_section
    description: "product section information"
    columns:
      - name: section
        description: "Section or department the product belongs to (e.g. woman, man, kids)."
        data_type: string
        tests:
          - unique
      - name: section_id
        description: "section id"
        data_type: int

  - name: uc1_dim_term
    description: "product category"
    columns:
      - name: terms
        description: "Terms and conditions associated with the product."
        data_type: string
        tests:
          - unique
      - name: term_id
        description: "term id"
        data_type: int

  - name: uc1_fact_sales
    description: "Sales fact table containing Zara product sales metrics, derived from the staging table."
    config:
      contract:
        enforced: true
    columns:
      - name: product_id
        description: "Unique identifier for each product, foreign key to dim_product."
        data_type: string

      - name: sales_volume
        description: "Total number of units sold for the product."
        data_type: bigint

      - name: sales
        description: "Total sales revenue for the product, rounded to 2 decimal places."
        data_type: double

      - name: price
        description: "price"
        data_type: double
